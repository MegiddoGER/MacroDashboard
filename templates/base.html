<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta http-equiv="content-language" content="de">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Macro Dashboard{% endblock %}</title>

    <!-- CSS — Reihenfolge ist bedeutsam: tokens → layout → components → topnav → motion -->
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/topnav.css">
    <link rel="stylesheet" href="/static/css/motion.css">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"
            integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
            crossorigin="anonymous"></script>

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
    <div class="app-shell">
        <!-- ═══ Top-Navigation ═══ -->
        {% include "partials/topnav.html" %}

        <!-- ═══ Main Content ═══ -->
        <main class="main-content" id="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Global JS -->
    <script>
        // ── Tab Switching ──
        document.addEventListener('click', function(e) {
            const tab = e.target.closest('.tab');
            if (!tab) return;
            const tabGroup = tab.closest('.tabs');
            const contentId = tab.dataset.tab;
            if (!tabGroup || !contentId) return;

            // Deactivate all tabs in group
            tabGroup.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            // Show corresponding content
            const parent = tabGroup.parentElement;
            parent.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const target = parent.querySelector('#' + contentId);
            if (target) target.classList.add('active');
        });

        // ── Expander Toggle ──
        document.addEventListener('click', function(e) {
            const header = e.target.closest('.expander-header');
            if (!header) return;
            header.closest('.expander').classList.toggle('open');
        });

        // ── Top-Navigation: Dropdowns ──
        // Ein einziger delegierter Handler bedient Navigation, Watchlist und
        // System-Menue. Die Panels werden ausschliesslich per Klasse ein- und
        // ausgeblendet und nie aus dem DOM entfernt — sonst ginge der per
        // hx-trigger="load" bereits geladene Watchlist-Inhalt verloren.
        (function() {
            function closeAll(except) {
                document.querySelectorAll('.topnav-item.open').forEach(function(item) {
                    if (item === except) return;
                    item.classList.remove('open');
                    const t = item.querySelector('.topnav-trigger');
                    if (t) t.setAttribute('aria-expanded', 'false');
                });
            }

            document.addEventListener('click', function(e) {
                const trigger = e.target.closest('.topnav-trigger');

                if (trigger) {
                    const item = trigger.closest('.topnav-item');
                    if (!item) return;
                    const willOpen = !item.classList.contains('open');
                    closeAll(item);
                    item.classList.toggle('open', willOpen);
                    trigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
                    return;
                }

                // Klicks innerhalb eines Panels duerfen nicht schliessen,
                // sonst bricht das Watchlist-Formular mitten in der Eingabe ab.
                if (e.target.closest('.topnav-panel')) return;

                closeAll(null);
            });

            document.addEventListener('keydown', function(e) {
                if (e.key !== 'Escape') return;
                const open = document.querySelector('.topnav-item.open');
                if (!open) return;
                const trigger = open.querySelector('.topnav-trigger');
                closeAll(null);
                if (trigger) trigger.focus();
            });
        })();

        // ── Toast Utility ──
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // ── Plotly Dark Theme Defaults ──
        window.PLOTLY_LAYOUT = {
            template: 'plotly_dark',
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            margin: {t: 50, b: 30, l: 50, r: 10},
            font: {family: 'Inter, sans-serif', size: 12, color: '#cbd5e1'},
            hovermode: 'x unified',
            modebar: {
                bgcolor: 'rgba(0,0,0,0)',
                color: '#ffffff',
                activecolor: '#00d4aa',
            },
        };

        // Render a Plotly chart from JSON (used by HTMX responses)
        function renderPlotly(elementId, figJson) {
            const fig = JSON.parse(figJson);
            Plotly.newPlot(elementId, fig.data, fig.layout, {displayModeBar: true, scrollZoom: false});
        }

        // ── Autocomplete Logic ──
        document.addEventListener('input', function(e) {
            if (!e.target.classList.contains('autocomplete-input')) return;
            const input = e.target;
            const query = input.value.trim();
            
            // Find or create dropdown
            let dropdown = input.nextElementSibling;
            if (!dropdown || !dropdown.classList.contains('autocomplete-dropdown')) {
                dropdown = document.createElement('div');
                dropdown.className = 'autocomplete-dropdown';
                input.parentNode.insertBefore(dropdown, input.nextSibling);
                // Ensure parent has relative positioning
                input.parentNode.style.position = 'relative';
            }

            if (query.length < 1) {
                dropdown.style.display = 'none';
                return;
            }

            if (input._acTimeout) clearTimeout(input._acTimeout);
            input._acTimeout = setTimeout(() => {
                fetch(`/api/ticker/search?q=${encodeURIComponent(query)}`)
                    .then(r => r.json())
                    .then(data => {
                        dropdown.innerHTML = '';
                        if (data.length === 0) {
                            dropdown.style.display = 'none';
                            return;
                        }
                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'autocomplete-item';
                            div.textContent = `${item.ticker} — ${item.name}`;
                            div.addEventListener('click', () => {
                                input.value = item.ticker;
                                // If there is a hidden name input in the same form, fill it
                                const form = input.closest('form');
                                if (form) {
                                    const nameInput = form.querySelector('input[name="company_name"]');
                                    if (nameInput) nameInput.value = item.name;
                                }
                                dropdown.style.display = 'none';
                            });
                            dropdown.appendChild(div);
                        });
                        dropdown.style.display = 'block';
                    })
                    .catch(console.error);
            }, 250);
        });

        // Hide autocomplete when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.classList.contains('autocomplete-input')) {
                document.querySelectorAll('.autocomplete-dropdown').forEach(d => d.style.display = 'none');
            }
        });
    </script>
    <!-- Autocomplete-Styles liegen jetzt in static/css/components.css -->
</body>
</html>
